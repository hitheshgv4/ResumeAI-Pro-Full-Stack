
# ==========================================
# ResumeAI Pro - Application Configuration
# ==========================================

spring.application.name=resumeai-api
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resumeai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# Hibernate / JPA Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Authentication Configuration
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ==========================================
# Server Error Configuration
# ==========================================

server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# Logging Configuration
# ==========================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO
