services:
  mysql:
    image: mysql:8.4
    container_name: resumeai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: resumeai
    ports:
      - "3306:3306"
    volumes:
      - resumeai_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  resumeai_mysql_data:
